name: "Version Check"
on:
  pull_request: ~
permissions:
  contents: read
jobs:
  version-check:
    name: "Version Check"
    permissions:
      contents: read
      pull-requests: read
    uses: "ITensor/ITensorActions/.github/workflows/VersionCheck.yml@v1"
    with:
      localregistry: "https://github.com/ITensor/ITensorRegistry.git"
