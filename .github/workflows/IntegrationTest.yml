name: "IntegrationTest"
on:
  push:
    branches:
      - "main"
    tags: "*"
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
      - "converted_to_draft"
permissions:
  contents: read
jobs:
  integration-test:
    name: "IntegrationTest"
    permissions:
      actions: read
      contents: read
    uses: "ITensor/ITensorActions/.github/workflows/IntegrationTest.yml@v1"
    secrets: "inherit"
    with:
      localregistry: "https://github.com/ITensor/ITensorRegistry.git"
      pkgs: |
        [
          "BlockSparseArrays",
          "DiagonalArrays",
          "FusionTensors",
          "GradedArrays"
        ]
