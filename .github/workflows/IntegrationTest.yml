name: "IntegrationTest"
on:
  push:
    branches:
      - "main"
    tags: "*"
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
      - "converted_to_draft"
jobs:
  integration-test:
    name: "IntegrationTest"
    uses: "ITensor/ITensorActions/.github/workflows/IntegrationTest.yml@dc36f8c88cd2858bdfa5e2458d108027d6b72807"
    secrets: "inherit"
    with:
      localregistry: "https://github.com/ITensor/ITensorRegistry.git"
      pkgs: |
        [
          "BlockSparseArrays",
          "DiagonalArrays",
          "FusionTensors",
          "GradedArrays"
        ]
